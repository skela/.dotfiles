set -g @plugin "catppuccin/tmux"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

# Skip v2 window format engine entirely - set formats manually below
set -g @catppuccin_window_status_style "none"

set -g status-left " "
set -g status-right "#[fg=#{@thm_fg},bg=default]#[fg=#{@thm_bg},bg=#{@thm_fg}] 󰒋 #H#[fg=#{@thm_fg},bg=default] #[fg=#{?client_prefix,#{@thm_red},#{@thm_fg}},bg=default]#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_red},#{@thm_fg}}]  #S#[fg=#{?client_prefix,#{@thm_red},#{@thm_fg}},bg=default]"

# Window tab pill format - inactive: surface_2 (grey) badge, active: blue badge
set -g window-status-format "#[fg=#{@thm_bg},bg=default,nobold,nounderscore,noitalics]#[fg=#{@thm_fg},bg=#{@thm_bg}]#W#{?window_zoomed_flag, 󰁌,} #[fg=#{@thm_surface_2},bg=#{@thm_bg},nobold,nounderscore,noitalics]█#[fg=#{@thm_bg},bg=#{@thm_surface_2}]#I#[fg=#{@thm_surface_2},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_bg},bg=default,nobold,nounderscore,noitalics]#[fg=#{@thm_fg},bg=#{@thm_bg}]#W#{?window_zoomed_flag, 󰁌,} #[fg=#{@thm_blue},bg=#{@thm_bg},nobold,nounderscore,noitalics]█#[fg=#{@thm_bg},bg=#{@thm_blue}]#I#[fg=#{@thm_blue},bg=default]"
set -g window-status-separator " "

set-option -g pane-border-status top
set-option -g pane-border-format ""

# only show status bar if there is more than one window
set -g status off
set-hook -g -w after-new-window 'run-shell "~/.config/tmux/tmux-functions.sh"'
set-hook -g -w after-kill-pane 'run-shell "~/.config/tmux/tmux-functions.sh"'
set-hook -g -w pane-exited 'run-shell "~/.config/tmux/tmux-functions.sh"'
set-hook -g -w window-layout-changed 'run-shell "~/.config/tmux/tmux-functions.sh"'
set-hook -g -w pane-focus-in 'run-shell "~/.config/tmux/tmux-functions.sh"'
