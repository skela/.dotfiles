$lock_cmd = ~/.config/hypr/scripts/lock.sh
$turn_on_screen_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

general {
	lock_cmd = $lock_cmd
	before_sleep_cmd = $lock_cmd
	after_sleep_cmd = $turn_on_screen_cmd
	on_unlock_cmd = $turn_on_screen_cmd
	inhibit_sleep = 3
}

# Display power is managed by lock.sh: it turns displays off only after
# hyprlock has started, never merely because the session is idle.
listener {
	timeout = 10
	on-timeout = true
	on-resume = $turn_on_screen_cmd
	ignore_inhibit = true
}
